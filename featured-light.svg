<title id="title">Current focus</title>
<desc id="desc">Capricorn, Four AI collaborators, one live workspace, and a route to a running build: 432 commits, 84 pull requests, 54,678 lines of code. Interface, Generative UI for a coding agent, from interactive replies to versioned artifacts: 67 commits, 2 pull requests, 37,434 lines of code. Prismatic, Automatic document tagging for subpoena requests: 151 commits, 46,986 lines of code. Hex, A local workspace for agents to plan, build, and review software together: Coming soon · Open source</desc>
<style>
